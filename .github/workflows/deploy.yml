name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run prebuild && npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GITHUB_APP_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_ID }}
          NEXT_PUBLIC_GITHUB_APP_INSTALLATION_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_INSTALLATION_ID }}
          NEXT_PUBLIC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_PRIVATE_KEY }}

      - name: Deploy
        run: npx wrangler pages deploy .open-next/assets --project-name=chiet-tu --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
